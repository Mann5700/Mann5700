name: 🐍 Contribution Snake

# Generates the animated "snake" that eats your contribution graph and publishes
# the SVGs to the `output` branch, which README.md references.

on:
  schedule:
    - cron: "0 0 * * *"     # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=a78bfa&color_dots=0b1021,4c1d95,7c3aed,a78bfa,f472b6
            dist/github-contribution-grid-snake.svg?color_snake=a78bfa&color_dots=e9d5ff,c4b5fd,a78bfa,7c3aed,4c1d95

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
