  <!-- planet + ring + orbiting moon (upper right) -->
  <g transform="translate(858,96)">
    <ellipse rx="78" ry="30" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="26" fill="url(#planet)"/>
    <ellipse rx="44" ry="13" fill="none" stroke="#f472b6" stroke-opacity="0.65" stroke-width="2.5" transform="rotate(-22)"/>
    <circle r="4.5" fill="#e9d5ff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M64,0 a64,24 0 1,1 -128,0 a64,24 0 1,1 128,0"/>
    </circle>
  </g>

  <!-- shooting stars -->
  <g opacity="0">
    <line x1="0" y1="0" x2="70" y2="-22" stroke="url(#title)" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="2.4" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" begin="1s" repeatCount="indefinite"
      keyTimes="0;0.16;1" values="-120 260; 1120 -60; 1120 -60" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1"/>
    <animate attributeName="opacity" dur="8s" begin="1s" repeatCount="indefinite"
      keyTimes="0;0.02;0.15;0.16;1" values="0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="54" y2="18" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <circle r="2" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="11s" begin="5s" repeatCount="indefinite"
      keyTimes="0;0.14;1" values="-100 40; 1120 360; 1120 360" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1"/>
    <animate attributeName="opacity" dur="11s" begin="5s" repeatCount="indefinite"
      keyTimes="0;0.02;0.13;0.14;1" values="0;1;1;0;0"/>
  </g>

  <!-- title -->
  <text x="500" y="158" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="70" font-weight="800" letter-spacing="7" fill="url(#title)" filter="url(#glow)">
    MANN PATEL
    <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
  </text>
  <text x="502" y="200" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18.5" letter-spacing="2.5" fill="#c4b5fd">
    &lt;/&gt; building clean software across the digital galaxy
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.6s" fill="freeze"/>
  </text>
  <text x="500" y="236" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12.5" letter-spacing="4" fill="#7c6ba8">
    NEW YORK METRO SECTOR  &#183;  OPEN TO COLLABORATE  &#183;  EST. EARTH
