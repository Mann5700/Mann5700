<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Mann Patel - space banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050014"/>
      <stop offset="55%" stop-color="#0b0224"/>
      <stop offset="100%" stop-color="#04010f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#4338ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#04010f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="82%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#04010f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>
  <rect width="1000" height="300" fill="url(#neb1)"/>
  <rect width="1000" height="300" fill="url(#neb2)"/>

