  <!-- rotating sparkle stars -->
    <g transform="translate(150,70)" fill="#e9d5ff">
      <path d="M0,-5 L1.1,-1.1 L5,0 L1.1,1.1 L0,5 L-1.1,1.1 L-5,0 L-1.1,-1.1 Z">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(760,60)" fill="#e9d5ff">
      <path d="M0,-4 L0.9,-0.9 L4,0 L0.9,0.9 L0,4 L-0.9,0.9 L-4,0 L-0.9,-0.9 Z">
